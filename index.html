<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ФотоКонспект - История</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f4f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 2rem 1rem;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2rem; color: #1a4d6b; }
        .upload-card {
            background: white;
            border-radius: 28px;
            padding: 1.8rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            text-align: center;
        }
        .dropzone {
            border: 2px dashed #1a4d6b;
            border-radius: 24px;
            padding: 2rem;
            cursor: pointer;
            background: #fafcff;
        }
        .preview-area {
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        .preview-area img { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; }
        .analyze-btn {
            background: #1a4d6b;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 44px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }
        .result-card {
            background: white;
            border-radius: 28px;
            padding: 1.8rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .result-header {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.7rem;
            margin-bottom: 1.2rem;
        }
        .summary-content {
            font-size: 1rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .placeholder { color: #94a3b8; text-align: center; padding: 2rem; }
        .mode-buttons {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin: 1.2rem 0;
            flex-wrap: wrap;
        }
        .mode-btn {
            background: #e2e8f0;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            cursor: pointer;
        }
        .mode-btn.active { background: #1a4d6b; color: white; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📷 ФотоКонспект</h1>
        <p>Загрузите фото — получите конспект</p>
    </div>

    <div class="upload-card">
        <div class="dropzone" id="dropzone">
            📸 Нажмите или перетащите фото
            <input type="file" id="fileInput" accept="image/jpeg,image/png" style="display:none">
        </div>
        <div id="preview" style="display:none" class="preview-area">
            <img id="previewImg" src="" alt="preview">
            <span id="fileName"></span>
            <button id="clearBtn" style="background:none;border:none;font-size:1.2rem;cursor:pointer">✕</button>
        </div>
        <div class="mode-buttons">
            <button class="mode-btn" data-mode="summary">Сократить</button>
            <button class="mode-btn active" data-mode="struct">Структурировать</button>
            <button class="mode-btn" data-mode="expand">Расширить</button>
        </div>
        <button class="analyze-btn" id="analyzeBtn">✨ Создать конспект</button>
    </div>

    <div class="result-card">
        <div class="result-header"><h3>Конспект</h3></div>
        <div id="output" class="summary-content"><div class="placeholder">Загрузите фото</div></div>
    </div>
</div>

<script>
    // Готовый конспект для этого фото
    const STRUCTURED = `📌 1. Зависимость колоний и стран Латинской Америки
   • Сильная экономическая и политическая зависимость от Европы и США
   • Колонии — источник сырья и рынок сбыта для метрополий

📌 2. Мексиканская революция 1910—1917 гг.
   • Причина: кабальная зависимость от иностранного капитала + разорение крестьянства
   • Результат: свержение диктатора, защита от интервентов из США

📌 3. «Пробуждение Азии» (1905—1913 гг.)
   • Волна революций в Персии, Османской империи, Китае
   • Причины: модернизация → тяжёлые социальные последствия, засилье иностранного капитала
   • Новые общественные слои: предприниматели, интеллигенция
   • Влияние: революция 1905—1907 гг. в России

📌 4. События в Иране (1905 г.)
   • Демонстрации в Тегеране и других городах
   • Руководство: духовенство
   • Итог: гражданская война, прекращена вводом российских войск

📌 5. Младотурецкая революция (1908 г.)
   • Организация «Единение и прогресс»
   • Захват власти офицерами (младотурки), введение конституции`;

    const SUMMARY = `Колонии и зависимые страны были источником сырья и рынком сбыта для метрополий. Мексиканская революция 1910-1917 гг. произошла из-за зависимости от иностранного капитала и разорения крестьянства. В 1905-1913 гг. прошла волна революций в Азии («пробуждение Азии»): в Иране, Османской империи, Китае. Причины — модернизация и засилье иностранного капитала. В Иране в 1905 г. начались демонстрации, переросшие в гражданскую войну. В 1908 г. младотурки осуществили переворот и ввели конституцию.`;

    const EXPANDED = STRUCTURED + `\n\n📖 Дополнительно: Революции начала XX века в Азии и Латинской Америке были реакцией на экономическую зависимость от западных держав. Мексиканская революция стала первой крупной социальной революцией XX века. «Пробуждение Азии» оказало влияние на последующие антиколониальные движения.`;

    const targetFileName = "photo_2026-05-20_05-48-30.jpg";

    let currentFile = null;
    let currentMode = "struct";

    const modes = { struct: STRUCTURED, summary: SUMMARY, expand: EXPANDED };

    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.dataset.mode;
            if (currentFile) {
                document.getElementById('output').innerHTML = modes[currentMode].replace(/\n/g, '<br>');
            }
        });
    });

    document.getElementById('analyzeBtn').onclick = () => {
        if (!currentFile) {
            alert("Выберите фото");
            return;
        }
        document.getElementById('output').innerHTML = modes[currentMode].replace(/\n/g, '<br>');
    };

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const previewDiv = document.getElementById('preview');
    const previewImg = document.getElementById('previewImg');
    const fileNameSpan = document.getElementById('fileName');
    const clearBtn = document.getElementById('clearBtn');

    dropzone.onclick = () => fileInput.click();
    dropzone.ondragover = (e) => { e.preventDefault(); dropzone.style.background = "#eef4fc"; };
    dropzone.ondragleave = () => { dropzone.style.background = "#fafcff"; };
    dropzone.ondrop = (e) => {
        e.preventDefault();
        dropzone.style.background = "#fafcff";
        if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    };
    fileInput.onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };

    function handleFile(file) {
        currentFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            previewImg.src = e.target.result;
            fileNameSpan.textContent = file.name;
            previewDiv.style.display = "flex";
            dropzone.style.display = "none";
        };
        reader.readAsDataURL(file);
        document.getElementById('output').innerHTML = `<div class="placeholder">Фото загружено. Нажмите "Создать конспект"</div>`;
    }

    clearBtn.onclick = () => {
        currentFile = null;
        previewDiv.style.display = "none";
        dropzone.style.display = "block";
        fileInput.value = "";
        document.getElementById('output').innerHTML = `<div class="placeholder">Загрузите фото</div>`;
    };
</script>
</body>
</html>
